<svg width="1920" height="1887" viewBox="0 0 1150 1130" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Dual-perception test generation pipeline</title>
<desc>Website URL feeds runBoth.js and Playwright, which runs Architecture A (DOM) and Architecture B (vision) independently in Loop 1 to explore the site and generate their own test cases. Loop 2 combines both architectures' results through the fusion chain (catalog, gap analysis, synthesis, execution, dashboard) to surface edge cases.</desc>
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .ttl { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; font-weight: 400; }
    .tab { font-size: 12px; font-weight: 600; }
    .capH { font-size: 13px; font-weight: 600; }
    .capB { font-size: 12px; font-weight: 400; }
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="1150" height="1130" fill="#12151C"/>

<!-- ================= HEADER CHAIN ================= -->
<rect x="610" y="30" width="160" height="44" rx="10" fill="#1B1F29" stroke="#333A47" stroke-width="1"/>
<text class="ttl" x="690" y="52" text-anchor="middle" dominant-baseline="central" fill="#E7E9EE">Website URL</text>
<line x1="690" y1="74" x2="690" y2="100" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

<rect x="570" y="104" width="240" height="60" rx="10" fill="#1B1F29" stroke="#333A47" stroke-width="1"/>
<text class="ttl" x="690" y="128" text-anchor="middle" dominant-baseline="central" fill="#E7E9EE">runBoth.js</text>
<text class="sub" x="690" y="150" text-anchor="middle" dominant-baseline="central" fill="#9AA1AE">one URL → one run ID</text>
<line x1="690" y1="164" x2="690" y2="190" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

<rect x="630" y="194" width="120" height="40" rx="10" fill="#1B1F29" stroke="#333A47" stroke-width="1"/>
<text class="ttl" x="690" y="214" text-anchor="middle" dominant-baseline="central" fill="#E7E9EE">Playwright</text>

<line x1="690" y1="234" x2="690" y2="246" stroke="#6B7280" stroke-width="1.6"/>
<path d="M690,246 L510,246 L510,286" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M690,246 L870,246 L870,286" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

<!-- ================= LOOP 1 ================= -->
<rect x="300" y="280" width="780" height="224" rx="16" fill="none" stroke="#333A47" stroke-width="1.4" stroke-dasharray="6 5"/>
<rect x="316" y="266" width="76" height="26" rx="6" fill="#2E2410" stroke="#E8B54C" stroke-width="1"/>
<text class="tab" x="354" y="280" text-anchor="middle" dominant-baseline="central" fill="#F5C86B">Loop 1</text>

<rect x="350" y="296" width="320" height="90" rx="14" fill="#17203A" stroke="#4C6EF5" stroke-width="1.2"/>
<text class="ttl" x="510" y="332" text-anchor="middle" dominant-baseline="central" fill="#A9BBFA">Architecture A (DOM)</text>
<text class="sub" x="510" y="356" text-anchor="middle" dominant-baseline="central" fill="#7C93F0">DOM crawl + memory log</text>

<rect x="710" y="296" width="320" height="90" rx="14" fill="#0F2620" stroke="#14B8A6" stroke-width="1.2"/>
<text class="ttl" x="870" y="332" text-anchor="middle" dominant-baseline="central" fill="#5EEAD4">Architecture B (Vision)</text>
<text class="sub" x="870" y="356" text-anchor="middle" dominant-baseline="central" fill="#2DD4BF">Screenshot → YOLO+OCR → vision DOM</text>

<line x1="510" y1="386" x2="510" y2="402" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="870" y1="386" x2="870" y2="402" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

<rect x="350" y="412" width="320" height="76" rx="14" fill="#141B30" stroke="#4C6EF5" stroke-width="1"/>
<text class="ttl" x="510" y="440" text-anchor="middle" dominant-baseline="central" fill="#C7D2FE">Explore and generate tests</text>
<text class="sub" x="510" y="462" text-anchor="middle" dominant-baseline="central" fill="#93A6F5">DOM crawl → candidate tests + pass/fail</text>

<rect x="710" y="412" width="320" height="76" rx="14" fill="#0D211C" stroke="#14B8A6" stroke-width="1"/>
<text class="ttl" x="870" y="440" text-anchor="middle" dominant-baseline="central" fill="#99F6E4">Explore and generate tests</text>
<text class="sub" x="870" y="462" text-anchor="middle" dominant-baseline="central" fill="#5EEAD4">Vision crawl → candidate tests + pass/fail</text>

<!-- Loop 1 margin caption -->
<text class="capH" x="30" y="350" fill="#F5C86B">Loop 1</text>
<text class="capB" x="30" y="372" fill="#9AA1AE">Each architecture crawls</text>
<text class="capB" x="30" y="390" fill="#9AA1AE">the site independently and</text>
<text class="capB" x="30" y="408" fill="#9AA1AE">produces its own test cases</text>
<text class="capB" x="30" y="426" fill="#9AA1AE">and pass/fail results.</text>

<!-- ================= MERGE ================= -->
<path d="M510,488 L510,530 L690,530 L690,580" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M870,488 L870,530 L690,530 L690,580" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

<!-- ================= LOOP 2 ================= -->
<rect x="300" y="560" width="780" height="514" rx="16" fill="none" stroke="#333A47" stroke-width="1.4" stroke-dasharray="6 5"/>
<rect x="316" y="546" width="76" height="26" rx="6" fill="#2E2410" stroke="#E8B54C" stroke-width="1"/>
<text class="tab" x="354" y="560" text-anchor="middle" dominant-baseline="central" fill="#F5C86B">Loop 2</text>

<rect x="460" y="590" width="460" height="70" rx="14" fill="#211A3F" stroke="#7C6FF0" stroke-width="1.2"/>
<text class="ttl" x="690" y="612" text-anchor="middle" dominant-baseline="central" fill="#C9C2FF">Catalog (S1)</text>
<text class="sub" x="690" y="634" text-anchor="middle" dominant-baseline="central" fill="#A79CFA">Merges A + B observations</text>
<line x1="690" y1="660" x2="690" y2="676" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

<rect x="460" y="686" width="460" height="70" rx="14" fill="#211A3F" stroke="#7C6FF0" stroke-width="1.2"/>
<text class="ttl" x="690" y="708" text-anchor="middle" dominant-baseline="central" fill="#C9C2FF">Gap analysis (S2)</text>
<text class="sub" x="690" y="730" text-anchor="middle" dominant-baseline="central" fill="#A79CFA">Conflicts + coverage gaps</text>
<line x1="690" y1="756" x2="690" y2="772" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

<rect x="460" y="782" width="460" height="70" rx="14" fill="#211A3F" stroke="#7C6FF0" stroke-width="1.2"/>
<text class="ttl" x="690" y="804" text-anchor="middle" dominant-baseline="central" fill="#C9C2FF">Synthesis (S4)</text>
<text class="sub" x="690" y="826" text-anchor="middle" dominant-baseline="central" fill="#A79CFA">Grounded, catalog-based tests</text>
<line x1="690" y1="852" x2="690" y2="868" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

<rect x="460" y="878" width="460" height="70" rx="14" fill="#211A3F" stroke="#7C6FF0" stroke-width="1.2"/>
<text class="ttl" x="690" y="900" text-anchor="middle" dominant-baseline="central" fill="#C9C2FF">Execution (FT)</text>
<text class="sub" x="690" y="922" text-anchor="middle" dominant-baseline="central" fill="#A79CFA">Runs accepted tests live</text>
<line x1="690" y1="948" x2="690" y2="964" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

<rect x="460" y="974" width="460" height="70" rx="14" fill="#211A3F" stroke="#7C6FF0" stroke-width="1.2"/>
<text class="ttl" x="690" y="996" text-anchor="middle" dominant-baseline="central" fill="#C9C2FF">Dashboard (S6)</text>
<text class="sub" x="690" y="1018" text-anchor="middle" dominant-baseline="central" fill="#A79CFA">Headline stats + coverage</text>

<!-- Loop 2 margin caption -->
<text class="capH" x="30" y="760" fill="#F5C86B">Loop 2</text>
<text class="capB" x="30" y="784" fill="#9AA1AE">Combines both architectures'</text>
<text class="capB" x="30" y="802" fill="#9AA1AE">results, compares pass/fail</text>
<text class="capB" x="30" y="820" fill="#9AA1AE">overlap across both, one, or</text>
<text class="capB" x="30" y="838" fill="#9AA1AE">neither, and repeats the</text>
<text class="capB" x="30" y="856" fill="#9AA1AE">cycle to surface edge cases.</text>

</svg>
